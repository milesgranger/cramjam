[project]
name = "cramjam"
# version is read from Cargo.toml (single source of truth), see [tool.maturin]
dynamic = ["version"]
keywords = ["compression", "decompression", "snappy", "zstd", "bz2", "gzip", "lz4", "brotli", "deflate", "blosc2"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Typing :: Typed",
]
license = { file = "LICENSE" }

[project.urls]
homepage = "https://github.com/milesgranger/pyrus-cramjam"
documentation = "https://docs.rs/cramjam/latest/cramjam"
repository = "https://github.com/milesgranger/pyrus-cramjam"

[build-system]
requires = ["maturin>=0.14"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
strip = true

[tool.pyright]
include = ["typing_tests"]
pythonVersion = "3.11"
pythonPlatform = "All"
stubPath = "src"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
norecursedirs = [".git", ".hypothesis", ".pytest_cache", ".venv*", "target", "typing_tests"]

[dependency-groups]
dev = [
    "ipython>=8.12.3",
    "maturin>=1.9,<2",
    "pyright>=1.1.399",
    "ruff-lsp>=0.0.62",
]

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "numpy",
  "pytest>=9.0.3",
  "pytest-xdist",
  "pytest-benchmark",
  "hypothesis>=6.165.10"
]
