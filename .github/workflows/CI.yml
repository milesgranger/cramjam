name: CI

on:
  push:
    branches:
      - master
      - 'releases/**'
  pull_request:
  release:
    types:
      - released
      - prereleased

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:

  cramjam-docs:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cramjam
        run: pip install -e .
      - name: Build docs
        run: |
          pip install pdoc
          pdoc cramjam --docformat numpy --show-source --mermaid --search -o docs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
    
  cramjam-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cramjam-js
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
      - name: Install WASM Pack
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo-binstall wasm-pack
      - name: Install Deps
        run: npm install -D
      - name: Build
        run: npm run build
      - name: Install Build
        run: npm run dev
      - name: Test
        run: npm run test

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install package and typing tools
        run: pip install -e '.[dev]' --group dev
      - name: Check types
        run: pyright
      - name: Check packaged typing files
        run: python -m pytest tests/test_typing_package.py

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Tests
        run: cargo test

  # Wheel selection (Python versions, test commands, Rust setup inside the Linux
  # containers, ...) lives in [tool.cibuildwheel] in pyproject.toml. The matrix
  # here only decides which runner builds which architectures.
  build-wheels:
    name: wheels-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux/musllinux containers; Rust is installed there by cibuildwheel's before-all.
          - { name: linux-x86_64-manylinux,  os: ubuntu-latest,    archs: x86_64,  build: '*-manylinux*' }
          - { name: linux-x86_64-musllinux,  os: ubuntu-latest,    archs: x86_64,  build: '*-musllinux*' }
          - { name: linux-i686-manylinux,    os: ubuntu-latest,    archs: i686,    build: '*-manylinux*' }
          - { name: linux-i686-musllinux,    os: ubuntu-latest,    archs: i686,    build: '*-musllinux*' }
          - { name: linux-aarch64-manylinux, os: ubuntu-24.04-arm, archs: aarch64, build: '*-manylinux*' }
          - { name: linux-aarch64-musllinux, os: ubuntu-24.04-arm, archs: aarch64, build: '*-musllinux*' }

          # macOS builds all run on Apple Silicon; x86_64 (and the x86_64 half of universal2) is
          # cross-compiled and tested under Rosetta 2.
          - { name: macos-x86_64,     os: macos-15, archs: x86_64,     rust-targets: 'x86_64-apple-darwin,aarch64-apple-darwin' }
          - { name: macos-arm64,      os: macos-15, archs: arm64,      rust-targets: 'x86_64-apple-darwin,aarch64-apple-darwin' }
          - { name: macos-universal2, os: macos-15, archs: universal2, rust-targets: 'x86_64-apple-darwin,aarch64-apple-darwin' }

          - { name: windows-amd64, os: windows-latest, archs: AMD64 }
          - { name: windows-x86,   os: windows-latest, archs: x86,   rust-targets: i686-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, archs: ARM64 }

          # Pyodide/WASM, every Pyodide version cibuildwheel builds by default. cibuildwheel
          # installs Emscripten itself; the Rust toolchain that each Pyodide release pins is
          # installed per wheel by the before-build hook in pyproject.toml.
          - { name: pyodide, os: ubuntu-latest, platform: pyodide }

    steps:
      - uses: actions/checkout@v4

      # Linux wheels get their Rust toolchain inside the build container, so it is only needed
      # on the runner itself elsewhere - including for Pyodide, which builds on the host.
      - name: Install Rust toolchain
        if: runner.os != 'Linux' || matrix.platform == 'pyodide'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: ${{ matrix.archs || 'auto' }}
          CIBW_BUILD: ${{ matrix.build || '*' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        if: ${{ ( startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') ) }}
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  # Architectures without native GitHub runners are built under QEMU emulation, which is slow.
  # Every Python version for an architecture shares one container and one cargo target
  # directory, so the dependency tree is compiled once and each extra version only rebuilds
  # the few crates that are bound to the interpreter.
  build-wheels-emulated:
    name: wheels-linux-${{ matrix.archs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        archs: [armv7l, ppc64le, s390x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        if: ${{ ( startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') ) }}
        with:
          name: wheels-linux-${{ matrix.archs }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Build sdist cramjam
        run: |
          python -m pip install build
          python -m build --sdist -o ./dist
      - name: Upload sdists
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  version-check:
    name: Verify tag matches package version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cramjam-python") | .version')
          echo "Cargo.toml version: ${VERSION}"
          echo "Tag: ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package version 'v${VERSION}'; update Cargo.toml before tagging a release."
            exit 1
          fi

  pypi-publish:
    name: Upload release to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-wheels, build-wheels-emulated, build-sdist, version-check]
    environment:
      name: pypi
      url: https://pypi.org/p/cramjam
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: List artifacts
      run: ls -lhs dist/
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

  gh-publish:
    name: Publish artifacts to GH
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: [build-wheels, build-wheels-emulated, build-sdist, version-check]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: List artifacts
      run: ls -lhs dist/
    - name: Upload to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
